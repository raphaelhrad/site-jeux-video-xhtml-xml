<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="fr" xml:lang="fr">

   <head>
      <meta charset="utf-8" />
      <title>Suggestions de jeux</title>
      <link href="../../styles/form.css" rel="stylesheet" title="Style principal"/>
      <link href="../../styles/formalt.css" rel="alternate stylesheet" title="Style alternatif"/>
   </head>

   <body>
      <div class="top-bar">
         <span id="date"> </span>
         <button type="button" id="switch">Changer de style</button>
       </div>
      <h1>Suggestions de jeux</h1>

      <form action="http://voca2.univ-poitiers.fr/traitement.php" method="post">

      <input id="user-agent-informations" type="text" disabled="disabled" class="hidden" value="" name="userAgentInformations"/>

      <fieldset>
         <legend>Informations sur le jeu</legend>
         <div>
            <label for="name">Nom</label>
            <input type="text" id="name" name="game_name" required="required"/>
         </div>
         <div>
            <label for="dev">Développeur(s)</label>
            <input type="text" id="dev" name="game_dev" required="required"/>
         </div>
         <div>
            <label for="inputdate">Date de sortie</label>
            <input type="date" id="inputdate" name="game_date" required="required"/>
         </div>


      </fieldset>

      <fieldset>
         <legend>Pourquoi ?</legend>
         <div>
            <label for="msg">Message</label>
            <textarea id="msg" name="user_message" required="required"> </textarea>
         </div>
      </fieldset>

      <fieldset>
         <legend>Acceptez-vous qu'on vous recontacte ?</legend>
         <label><input type="radio" id="rct-yes" name="recontact" value="yes" required="required"/>Oui</label>
         <label><input type="radio" id="rct-no" name="recontact" value="no" required="required"/>Non</label>
      </fieldset>

      <br/>

      <div class="button">
         <button type="button" class="validate-button2">Valider le formulaire</button>
      </div>

      <div class="button">
         <button type="submit">Envoyer votre message</button>
      </div>

      </form>

      <div id="recap2" class="recap-section2" style="display: none;">
         <h2>Récapitulatif de votre saisie</h2>
         <div id="recap-content2"> </div>
      </div>

      <div class="recap-button">
         <button type="button" id="showRecap2">Afficher le récapitulatif</button>
      </div>

      <div class="retour-accueil">
         <a href="../../index.xhtml">Retour à la page d'accueil</a>
      </div>

      <script async="async" src="../../code/javascript/form.js"> </script>
      <script async="async" src="../../code/javascript/form2.js"> </script>
      <script defer="defer" src="../../code/javascript/foreverypage.js"> </script>
   </body>

</html>
