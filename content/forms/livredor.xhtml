<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="fr" xml:lang="fr">

   <head>
      <meta charset="utf-8" />
      <title>Livre d'or</title>
      <link href="../../styles/form.css" rel="stylesheet" title="Style principal"/>
      <link href="../../styles/formalt.css" rel="alternate stylesheet" title="Style alternatif"/>

   </head>

   <body>
      <div class="top-bar">
         <span id="date"> </span>
         <button type="button" id="switch">Changer de style</button>
       </div>
      <h1>Livre d'or</h1>

      <form action="http://voca2.univ-poitiers.fr/traitement.php"
            method="post">
      <input id="user-agent-informations" type="text" disabled="disabled" class="hidden" value="" name="userAgentInformations"/>
      <fieldset>
         <legend>Votre identité</legend>
      <div>
         <label for="name">Nom</label>
         <input type="text" id="name" name="user_name" required="required"/>
      </div>
      <div>
         <label for="mail">E-mail</label>
         <input type="email" id="mail" name="user_email" required="required"/>
      </div>
      <div>
         <label for="theDate">Date de visite</label>
         <input type="date" id="theDate" required="required"/>
      </div>
         </fieldset>
         <fieldset>
            <legend>Votre avis</legend>
      <div>
         <label for="note">Note</label>
         <br/>
         <select id="note" name="user_ranking">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
         </select>
      </div>

      <div>
         <label for="msg">Message</label>
         <textarea id="msg" name="user_message" required="required"> </textarea>
      </div>
         </fieldset>

      <br/>

      <div class="button">
         <button type="button" class="validate-button">Valider le formulaire</button>
      </div>

      <div class="button">
         <button type="submit">Envoyer votre message</button>
      </div>

      </form>

      <div id="recap" class="recap-section" style="display: none;">
         <h2>Récapitulatif de votre saisie</h2>
         <div id="recap-content"> </div>
      </div>

      <div class="recap-button">
         <button type="button" id="showRecap">Afficher le récapitulatif</button>
      </div>

      <div class="retour-accueil">
         <a href="../../index.xhtml">Retour à la page d'accueil</a>
      </div>

      <script async="async" src="../../code/javascript/form.js"> </script>
      <script defer="defer" src="../../code/javascript/foreverypage.js"> </script>
   </body>

</html>
